{% extends "base_admin.html" %}
{% block title %}制度知识库{% endblock %}
{% block crumb %}制度知识库 · 上传 / 切片 / 向量化{% endblock %}
{% block content %}
<div class="card">
  <h3>上传制度文档</h3>
  <div style="display:flex;gap:12px;align-items:center;">
    <input type="file" id="fileInput" accept=".md,.pdf">
    <button class="btn" id="uploadBtn" onclick="upload()">上传并入库</button>
    <span class="muted">支持 .md / .pdf（文本型），上传后自动切片、向量化，问答立即生效</span>
  </div>
  <div class="muted" id="uploadStatus" style="margin-top:10px;"></div>
</div>

<div class="card">
  <h3>文档列表</h3>
  <table class="grid">
    <thead><tr>
      <th>文档名</th><th>类型</th><th>切片数</th><th>上传人</th><th>上传时间</th><th style="width:170px;">操作</th>
    </tr></thead>
    <tbody id="docBody"><tr><td colspan="6" class="muted">加载中…</td></tr></tbody>
  </table>
</div>
{% endblock %}
{% block script %}
<script>
// 加载文档列表
async function loadDocs() {
  const resp = await api("/admin/kb/documents");
  const d = await resp.json();
  document.getElementById("docBody").innerHTML = d.items.length
    ? d.items.map(x => `<tr>
        <td>${esc(x.doc_name)}</td>
        <td><span class="tag">${esc(x.doc_type)}</span></td>
        <td>${x.chunk_count}</td>
        <td>${esc(x.uploader || "-")}</td>
        <td class="muted">${esc((x.created_at || "").slice(0, 19).replace("T", " "))}</td>
        <td>
          <button class="btn light" onclick="reindex('${x.id}')">重新切片</button>
          <button class="btn danger" onclick="delDoc('${x.id}', '${esc(x.doc_name)}')">删除</button>
        </td>
      </tr>`).join("")
    : '<tr><td colspan="6" class="muted">暂无文档，请先上传</td></tr>';
}

// 上传：multipart 表单提交（不走 JSON，单独 fetch）
async function upload() {
  const f = document.getElementById("fileInput").files[0];
  if (!f) { showError("请先选择文件"); return; }
  const btn = document.getElementById("uploadBtn");
  btn.disabled = true;
  document.getElementById("uploadStatus").textContent = "正在解析并切片向量化…";
  try {
    const form = new FormData();
    form.append("file", f);
    const resp = await fetch("/api/v1/admin/kb/upload", { method: "POST", body: form });
    const d = await resp.json();
    if (!resp.ok) { showError(d.message || "上传失败"); return; }
    showOk(`上传成功：已生成 ${d.chunks} 个切片并入库`);
    document.getElementById("fileInput").value = "";
    loadDocs();
  } finally {
    btn.disabled = false;
    document.getElementById("uploadStatus").textContent = "";
  }
}

// 删除（二次确认）
async function delDoc(id, name) {
  if (!confirm(`确认删除《${name}》？删除后问答将不再引用该制度。`)) return;
  const resp = await api("/admin/kb/documents/" + id, { method: "DELETE" });
  const d = await resp.json();
  if (!resp.ok) { showError(d.message); return; }
  showOk("已删除");
  loadDocs();
}

// 重新切片 + 向量化
async function reindex(id) {
  const resp = await api("/admin/kb/documents/" + id + "/reindex", { method: "POST" });
  const d = await resp.json();
  if (!resp.ok) { showError(d.message); return; }
  showOk(`重建完成：${d.chunks} 个切片`);
  loadDocs();
}

loadDocs();
</script>
{% endblock %}
