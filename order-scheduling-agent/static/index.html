<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>订单排产与设备异常智能体 · 员工问答</title>
<style>
  /* ===== 全局与布局 ===== */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "Microsoft YaHei", sans-serif; background: #f0f2f5; height: 100vh; display: flex; flex-direction: column; }
  header { background: #1f3864; color: #fff; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
  header h1 { font-size: 17px; font-weight: 600; }
  header .user { font-size: 13px; opacity: .85; }
  header button { margin-left: 12px; background: transparent; color: #fff; border: 1px solid #ffffff66; border-radius: 4px; padding: 3px 10px; cursor: pointer; }
  main { flex: 1; display: flex; overflow: hidden; }

  /* ===== 左侧会话栏 ===== */
  aside { width: 230px; background: #fff; border-right: 1px solid #e4e7ec; display: flex; flex-direction: column; }
  aside .new-btn { margin: 12px; padding: 9px; background: #1f3864; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; }
  #sessionList { flex: 1; overflow-y: auto; }
  .session-item { padding: 11px 14px; font-size: 13px; color: #333; cursor: pointer; border-bottom: 1px solid #f2f2f2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .session-item:hover { background: #f5f7fb; }
  .session-item.active { background: #e8eef9; color: #1f3864; font-weight: 600; }

  /* ===== 聊天主区 ===== */
  .chat-area { flex: 1; display: flex; flex-direction: column; }
  #messages { flex: 1; overflow-y: auto; padding: 22px 28px; }
  .msg { margin-bottom: 18px; display: flex; }
  .msg.user { justify-content: flex-end; }
  .bubble { max-width: 72%; padding: 11px 15px; border-radius: 10px; font-size: 14px; line-height: 1.75; white-space: pre-wrap; word-break: break-word; }
  .msg.user .bubble { background: #1f3864; color: #fff; border-bottom-right-radius: 2px; }
  .msg.assistant .bubble { background: #fff; border: 1px solid #e4e7ec; border-bottom-left-radius: 2px; }

  /* 检索状态提示 */
  .status-tip { color: #8a94a6; font-size: 12px; margin-top: 6px; }
  .status-tip::after { content: "…"; animation: dots 1.2s infinite; }
  @keyframes dots { 0%{opacity:.2} 50%{opacity:1} 100%{opacity:.2} }

  /* 制度引用来源卡片 */
  .sources { margin-top: 10px; border-top: 1px dashed #dfe4ec; padding-top: 8px; }
  .sources .src-title { font-size: 12px; color: #1f3864; font-weight: 600; margin-bottom: 4px; }
  .src-item { font-size: 12px; color: #667; background: #f6f8fc; border-left: 3px solid #1f3864; padding: 6px 9px; margin-top: 5px; border-radius: 3px; }
  .src-item .doc { font-weight: 600; color: #1f3864; }

  /* 输入区 */
  .input-bar { padding: 14px 28px; background: #fff; border-top: 1px solid #e4e7ec; display: flex; gap: 10px; }
  #questionInput { flex: 1; border: 1px solid #d4dae3; border-radius: 8px; padding: 11px 14px; font-size: 14px; resize: none; height: 46px; font-family: inherit; }
  #sendBtn { background: #1f3864; color: #fff; border: none; border-radius: 8px; padding: 0 26px; font-size: 14px; cursor: pointer; }
  #sendBtn:disabled { background: #9aa7bd; cursor: not-allowed; }

  /* 登录遮罩 */
  #loginMask { position: fixed; inset: 0; background: #1f3864cc; display: flex; align-items: center; justify-content: center; z-index: 99; }
  .login-box { background: #fff; border-radius: 12px; padding: 32px; width: 320px; }
  .login-box h2 { font-size: 18px; color: #1f3864; margin-bottom: 18px; text-align: center; }
  .login-box input { width: 100%; padding: 10px 12px; margin-bottom: 12px; border: 1px solid #d4dae3; border-radius: 6px; font-size: 14px; }
  .login-box button { width: 100%; padding: 11px; background: #1f3864; color: #fff; border: none; border-radius: 6px; font-size: 15px; cursor: pointer; }
  .login-box .tip { font-size: 12px; color: #99a; text-align: center; margin-top: 10px; }
  .err-toast { position: fixed; top: 70px; left: 50%; transform: translateX(-50%); background: #c0392b; color: #fff; padding: 10px 22px; border-radius: 6px; font-size: 14px; display: none; z-index: 100; }
</style>
</head>
<body>

<!-- 顶部栏 -->
<header>
  <h1>订单排产与设备异常智能体 · 员工问答</h1>
  <div>
    <span class="user" id="userInfo"></span>
    <button onclick="logout()">退出登录</button>
  </div>
</header>

<main>
  <!-- 左侧：会话列表 -->
  <aside>
    <button class="new-btn" onclick="newSession()">＋ 新建会话</button>
    <div id="sessionList"></div>
  </aside>

  <!-- 右侧：聊天区 -->
  <div class="chat-area">
    <div id="messages"></div>
    <div class="input-bar">
      <textarea id="questionInput" placeholder="请输入问题，例如：插单时原来的订单怎么处理？（Enter 发送，Shift+Enter 换行）"></textarea>
      <button id="sendBtn" onclick="sendQuestion()">发送</button>
    </div>
  </div>
</main>

<!-- 登录遮罩：默认填入演示账号 -->
<div id="loginMask">
  <div class="login-box">
    <h2>员工登录</h2>
    <input id="loginUser" value="employee" placeholder="用户名">
    <input id="loginPass" type="password" value="123456" placeholder="密码">
    <button onclick="login()">登 录</button>
    <div class="tip">演示账号：employee / 123456（管理员：admin）</div>
  </div>
</div>

<div class="err-toast" id="errToast"></div>

<script>
/* ================= 全局状态 ================= */
const API = "/api/v1";
let token = localStorage.getItem("token") || "";   // JWT，刷新后保持登录
let sessionId = null;                              // 当前会话 ID
let sending = false;                               // 是否正在等待回答（防重复发送）

/* ================= 通用工具 ================= */
// 顶部错误提示条，3 秒自动消失
function showError(msg) {
  const t = document.getElementById("errToast");
  t.textContent = msg;
  t.style.display = "block";
  setTimeout(() => t.style.display = "none", 3000);
}

// 带鉴权的 fetch 封装；401 时跳回登录
async function api(path, options = {}) {
  options.headers = Object.assign({
    "Content-Type": "application/json",
    "Authorization": "Bearer " + token
  }, options.headers || {});
  const resp = await fetch(API + path, options);
  if (resp.status === 401) { logout(); throw new Error("登录已过期，请重新登录"); }
  return resp;
}

/* ================= 登录 / 退出 ================= */
async function login() {
  const resp = await fetch(API + "/auth/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      username: document.getElementById("loginUser").value,
      password: document.getElementById("loginPass").value
    })
  });
  const data = await resp.json();
  if (!resp.ok) { showError(data.message || "登录失败"); return; }
  token = data.token;
  localStorage.setItem("token", token);
  document.getElementById("userInfo").textContent = data.user.display_name;
  document.getElementById("loginMask").style.display = "none";
  loadSessions();
}

function logout() {
  localStorage.removeItem("token");
  location.reload();
}

/* ================= 会话管理 ================= */
// 加载侧边栏会话列表
async function loadSessions() {
  const resp = await api("/sessions");
  const data = await resp.json();
  const box = document.getElementById("sessionList");
  box.innerHTML = "";
  data.items.forEach(s => {
    const div = document.createElement("div");
    div.className = "session-item" + (s.session_id === sessionId ? " active" : "");
    div.textContent = s.title;
    div.onclick = () => openSession(s.session_id);
    box.appendChild(div);
  });
}

// 新建会话：清空当前会话状态与消息区
function newSession() {
  sessionId = null;
  document.getElementById("messages").innerHTML = "";
  loadSessions();
}

// 打开历史会话：加载消息记录并渲染
async function openSession(id) {
  sessionId = id;
  const resp = await api(`/sessions/${id}/messages`);
  const data = await resp.json();
  if (!resp.ok) { showError(data.message); return; }
  const box = document.getElementById("messages");
  box.innerHTML = "";
  data.items.forEach(m => {
    if (m.role === "user") addMessage("user", m.content);
    else addMessage("assistant", m.content, m.sources || []);
  });
  loadSessions();
}

/* ================= 消息渲染 ================= */
// 向消息区追加一条消息，返回气泡元素（供流式更新）
function addMessage(role, content, sources = []) {
  const box = document.getElementById("messages");
  const wrap = document.createElement("div");
  wrap.className = "msg " + role;
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = content;
  wrap.appendChild(bubble);
  box.appendChild(wrap);
  if (sources.length) renderSources(bubble, sources);
  box.scrollTop = box.scrollHeight;
  return bubble;
}

// 在回答底部渲染制度引用来源卡片
function renderSources(bubble, items) {
  const box = document.createElement("div");
  box.className = "sources";
  box.innerHTML = '<div class="src-title">📄 制度依据</div>';
  items.forEach(s => {
    const div = document.createElement("div");
    div.className = "src-item";
    const doc = document.createElement("span");
    doc.className = "doc";
    doc.textContent = "《" + s.doc_name + "》";
    div.appendChild(doc);
    div.appendChild(document.createTextNode(" " + s.snippet));
    box.appendChild(div);
  });
  bubble.appendChild(box);
}

/* ================= 发送问题（SSE 流式） ================= */
async function sendQuestion() {
  const input = document.getElementById("questionInput");
  const question = input.value.trim();
  if (!question || sending) return;

  sending = true;
  document.getElementById("sendBtn").disabled = true;
  input.value = "";
  addMessage("user", question);

  // 先插入空气泡 + 检索状态提示
  const bubble = addMessage("assistant", "");
  const tip = document.createElement("div");
  tip.className = "status-tip";
  tip.textContent = "正在检索制度";
  tip.style.display = "none";   // 等 status 帧到达后再显示
  bubble.appendChild(tip);

  // 打字机渲染队列：token 先入队，定时器逐字吐出，效果更平滑
  let queue = "", typeTimer = null, streamDone = false;
  const textNode = document.createTextNode("");
  bubble.insertBefore(textNode, tip);
  function typewriter() {
    if (queue.length) {
      textNode.textContent += queue[0];
      queue = queue.slice(1);
      document.getElementById("messages").scrollTop = 1e9;
    }
    if (streamDone && !queue.length) { clearInterval(typeTimer); typeTimer = null; }
  }
  typeTimer = setInterval(typewriter, 18);

  try {
    const resp = await api("/chat", {
      method: "POST",
      body: JSON.stringify({ session_id: sessionId, question: question })
    });
    if (!resp.ok) {
      // 建流前的 JSON 错误（参数 / 鉴权 / 会话问题）
      const data = await resp.json();
      throw new Error(data.message || "请求失败");
    }

    // 按 SSE 协议逐帧解析（event + data，空行分隔）
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const frames = buffer.split("\n\n");
      buffer = frames.pop();           // 最后一段可能不完整，留到下次
      for (const frame of frames) {
        if (!frame.trim()) continue;
        const event = (frame.match(/^event: (.+)$/m) || [])[1];
        const dataLine = (frame.match(/^data: (.*)$/m) || [])[1];
        if (!event || !dataLine) continue;
        const data = JSON.parse(dataLine);

        if (event === "meta") {
          sessionId = data.session_id;             // 新会话时保存 ID
        } else if (event === "status") {
          tip.style.display = "block";             // 显示“正在检索制度…”
        } else if (event === "token") {
          tip.style.display = "none";              // 首个 token 到达，隐藏状态
          queue += data.text;                      // 进入打字机队列
        } else if (event === "sources") {
          if (data.items.length) renderSources(bubble, data.items);
        } else if (event === "done") {
          streamDone = true;
        } else if (event === "error") {
          streamDone = true;
          showError(data.message);                 // 流式中途错误
        }
      }
    }
    streamDone = true;
    loadSessions();                                // 刷新侧边栏标题/时间
  } catch (e) {
    streamDone = true;
    showError(e.message || "网络异常，请稍后重试");
  } finally {
    sending = false;
    document.getElementById("sendBtn").disabled = false;
    input.focus();
  }
}

/* ================= 页面初始化 ================= */
document.getElementById("questionInput").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendQuestion(); }
});
if (token) {
  // 已有令牌：跳过登录直接加载（令牌失效时 api 会自动跳回登录）
  document.getElementById("loginMask").style.display = "none";
  loadSessions();
}
</script>
</body>
</html>
