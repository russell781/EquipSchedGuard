<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>登录 · 订单排产与设备异常智能体系统</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "Microsoft YaHei", sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: linear-gradient(135deg, #16264a 0%, #1f3864 60%, #2d4f86 100%); }
  .box { background: #fff; border-radius: 14px; padding: 36px; width: 340px; box-shadow: 0 18px 50px #0004; }
  .box h1 { font-size: 19px; color: #1f3864; text-align: center; line-height: 1.6; }
  .box .sub { text-align: center; color: #99a; font-size: 12px; margin: 8px 0 22px; }
  .box input { width: 100%; padding: 11px 13px; margin-bottom: 13px; border: 1px solid #d4dae3; border-radius: 7px; font-size: 14px; }
  .box button { width: 100%; padding: 12px; background: #1f3864; color: #fff; border: none; border-radius: 7px; font-size: 15px; cursor: pointer; }
  .err { color: #c0392b; font-size: 13px; text-align: center; margin-top: 12px; min-height: 18px; }
  .tip { font-size: 12px; color: #99a; text-align: center; margin-top: 14px; line-height: 1.8; }
</style>
</head>
<body>
<div class="box">
  <h1>订单排产与设备异常<br>智能体系统</h1>
  <div class="sub">员工问答 / 管理后台统一入口</div>
  <input id="username" value="admin" placeholder="用户名">
  <input id="password" type="password" value="123456" placeholder="密码">
  <button onclick="login()">登 录</button>
  <div class="err" id="err"></div>
  <div class="tip">管理员：admin / 123456<br>员工：employee / 123456</div>
</div>
<script>
async function login() {
  // 提交账号密码；成功后由服务端写入 Cookie，按角色跳转不同页面
  const resp = await fetch("/api/v1/auth/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      username: document.getElementById("username").value,
      password: document.getElementById("password").value
    })
  });
  const data = await resp.json();
  if (!resp.ok) { document.getElementById("err").textContent = data.message || "登录失败"; return; }
  localStorage.setItem("token", data.token);  // 员工问答页使用 Bearer 头
  location.href = data.user.role === "admin" ? "/admin" : "/";
}
document.getElementById("password").addEventListener("keydown", e => {
  if (e.key === "Enter") login();
});
</script>
</body>
</html>
